name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Worker environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - dev
      smoke_base_url:
        description: "Base URL to smoke-test after deploy"
        required: true
        default: "https://omniwx-api-production.omniwx.workers.dev"
        type: string
      message:
        description: "Deploy message"
        required: true
        default: "Manual Worker deploy"
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.target_env || 'manual' }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: omniwx-api

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.target_env || 'production' }}
      SMOKE_BASE_URL: ${{ inputs.smoke_base_url || 'https://omniwx-api-production.omniwx.workers.dev' }}
      DEPLOY_MESSAGE: ${{ inputs.message || 'Manual Worker deploy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: omniwx-api/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub repository secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Type-check Worker
        run: npx tsc --noEmit

      - name: Deploy Worker
        shell: bash
        run: |
          args=(deploy --keep-vars --message "$DEPLOY_MESSAGE")
          if [ "$TARGET_ENV" = "production" ]; then
            args+=(--env production)
          elif [ "$TARGET_ENV" != "dev" ]; then
            echo "::error::Unsupported target_env: $TARGET_ENV"
            exit 1
          fi
          npx wrangler "${args[@]}"

      - name: Smoke test Worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$SMOKE_BASE_URL/v1/health" > /tmp/health.json
          curl --fail --silent --show-error "$SMOKE_BASE_URL/v1/radar/backend/status" > /tmp/radar-status.json
          node - <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
          const radar = JSON.parse(fs.readFileSync("/tmp/radar-status.json", "utf8"));
          if (!health.success) throw new Error("Health check did not report success");
          if (!radar.ok) throw new Error("Radar backend status did not report ok");
          console.log(JSON.stringify({
            ok: true,
            health: health.success,
            radarR2Bound: radar.ownedPipeline?.r2?.bound ?? null,
            mrmsEnabled: radar.ownedPipeline?.mrms?.enabled ?? null,
            publicTileDeliveryEnabled: radar.ownedPipeline?.mrms?.publicTileDeliveryEnabled ?? null,
          }, null, 2));
          NODE
