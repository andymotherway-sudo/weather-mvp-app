name: MRMS radar cycle
run-name: MRMS ${{ inputs.target_env || 'production' }} apply=${{ inputs.apply || false }} z${{ inputs.min_zoom || '3' }}-${{ inputs.max_zoom || '10' }} backfill=${{ inputs.backfill_frames || '1' }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - dev
      apply:
        description: "Write to R2"
        required: true
        default: false
        type: boolean
      max_zoom:
        description: "Maximum MRMS tile zoom"
        required: true
        default: "10"
        type: choice
        options:
          - "4"
          - "5"
          - "6"
          - "7"
          - "8"
          - "9"
          - "10"
      min_zoom:
        description: "Minimum MRMS tile zoom"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "4"
      retain_frames:
        description: "Rolling retained frame count"
        required: true
        default: "12"
        type: choice
        options:
          - "6"
          - "12"
      backfill_frames:
        description: "Newest timestamped frames to publish this run"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      max_frame_age_minutes:
        description: "Maximum retained history age"
        required: true
        default: "360"
        type: choice
        options:
          - "180"
          - "360"
          - "480"

permissions:
  contents: read

concurrency:
  group: mrms-radar-cycle-${{ inputs.target_env || 'production' }}
  cancel-in-progress: true

jobs:
  publish-mrms:
    name: Publish bounded MRMS radar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: omniwx-api

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      MRMS_TARGET_ENV: ${{ inputs.target_env || 'production' }}
      MRMS_MIN_ZOOM: ${{ inputs.min_zoom || '3' }}
      MRMS_MAX_ZOOM: ${{ inputs.max_zoom || '10' }}
      MRMS_RETAIN_FRAMES: ${{ inputs.retain_frames || '12' }}
      MRMS_BACKFILL_FRAMES: ${{ inputs.backfill_frames || '1' }}
      MRMS_MAX_FRAME_AGE_MINUTES: ${{ inputs.max_frame_age_minutes || '360' }}
      MRMS_APPLY: ${{ inputs.apply }}
      MRMS_SMOKE_BASE_URL: ${{ inputs.target_env == 'dev' && 'https://omniwx-api.omniwx.workers.dev' || 'https://omniwx-api-production.omniwx.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: omniwx-api/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ecCodes system library
        run: sudo apt-get update && sudo apt-get install -y libeccodes0 libeccodes-dev
        working-directory: .

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install MRMS Python dependencies
        run: python -m pip install --target ../tmp/mrms-pydeps cfgrib eccodes xarray numpy pillow

      - name: Check R2 credentials
        shell: bash
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Show MRMS cycle settings
        shell: bash
        run: |
          echo "target_env=$MRMS_TARGET_ENV"
          echo "apply=$MRMS_APPLY"
          echo "min_zoom=$MRMS_MIN_ZOOM"
          echo "max_zoom=$MRMS_MAX_ZOOM"
          echo "retain_frames=$MRMS_RETAIN_FRAMES"
          echo "backfill_frames=$MRMS_BACKFILL_FRAMES"
          echo "max_frame_age_minutes=$MRMS_MAX_FRAME_AGE_MINUTES"
          if [ "$MRMS_APPLY" != "true" ]; then
            echo "::warning::This is a dry-run. It will render MRMS but will not write to R2 or advance the live app timeline."
          fi

      - name: Type-check API scripts
        run: npx tsc --noEmit

      - name: Run MRMS radar cycle
        shell: bash
        run: |
          args=(
            --env "$MRMS_TARGET_ENV"
            --min-z "$MRMS_MIN_ZOOM"
            --max-z "$MRMS_MAX_ZOOM"
            --max-tiles 12000
            --retain-frames "$MRMS_RETAIN_FRAMES"
            --backfill-frames "$MRMS_BACKFILL_FRAMES"
            --max-frame-age-minutes "$MRMS_MAX_FRAME_AGE_MINUTES"
            --min-retained-max-z "$MRMS_MAX_ZOOM"
            --sampling bilinear
            --uploader s3
          )
          if [ "$MRMS_APPLY" = "true" ]; then
            args+=(--apply)
          fi
          npm run mrms:cycle -- "${args[@]}"

      - name: Smoke test MRMS timeline
        if: env.MRMS_APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$MRMS_SMOKE_BASE_URL/v1/radar/mrms/timeline?product=MergedReflectivityQCComposite" > /tmp/mrms-timeline.json
          node - <<'NODE'
          const fs = require("node:fs");
          const timeline = JSON.parse(fs.readFileSync("/tmp/mrms-timeline.json", "utf8"));
          if (!timeline.ok) throw new Error("MRMS timeline did not report ok");
          const frame = Array.isArray(timeline.frames) ? timeline.frames[0] : null;
          if (!frame) throw new Error("MRMS timeline has no frames");
          if (frame.tileDelivery !== "worker-r2") {
            throw new Error(`MRMS tileDelivery is ${frame.tileDelivery}, expected worker-r2`);
          }
          const validTimeMs = Date.parse(String(frame.validTime || frame.time || ""));
          if (!Number.isFinite(validTimeMs)) {
            throw new Error("MRMS frame has no parseable validTime");
          }
          const ageMinutes = (Date.now() - validTimeMs) / 60_000;
          if (ageMinutes > 180) {
            throw new Error(`MRMS frame is stale after publish: ${Math.round(ageMinutes)} minutes old`);
          }
          console.log(JSON.stringify({
            ok: true,
            frame: frame.frame,
            validTime: frame.validTime,
            ageMinutes: Math.round(ageMinutes),
            frameCount: timeline.frameCount,
            maxZoom: timeline.maxZoom,
            tileDelivery: frame.tileDelivery,
            tileTemplate: frame.tileTemplate,
          }, null, 2));
          NODE

      - name: Report MRMS retained storage
        if: env.MRMS_APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm --silent run mrms:storage-status -- \
            --env "$MRMS_TARGET_ENV" \
            --product MergedReflectivityQCComposite \
            --fail-storage-mb 5120 \
            --fail-stale-objects 0 \
            --json > /tmp/mrms-storage-status.json
          cat /tmp/mrms-storage-status.json
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const status = JSON.parse(fs.readFileSync("/tmp/mrms-storage-status.json", "utf8"));
          const lines = [
            "## MRMS retained storage",
            "",
            `- Environment: ${status.env}`,
            `- Product: ${status.product}`,
            `- Timeline frames: ${status.timeline.frameCount}`,
            `- Newest frame age: ${status.timeline.newestAgeMinutes} minutes`,
            `- Max zoom: ${status.timeline.maxZoom}`,
            `- Tile delivery: ${status.timeline.tileDelivery}`,
            `- R2 objects under prefix: ${status.storage.objectCount}`,
            `- R2 total under prefix: ${status.storage.totalMb} MB`,
            `- Retained objects: ${status.storage.retainedObjectCount}`,
            `- Retained bytes: ${status.storage.retainedMb} MB`,
            `- Stale objects: ${status.storage.staleObjectCount}`,
            `- Stale bytes: ${status.storage.staleMb} MB`,
            "",
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          NODE
