name: NEXRAD Level III cycle
run-name: Level III ${{ inputs.target_env || 'production' }} ${{ inputs.sites || inputs.site || 'IWA,MPX,DLH' }} ${{ inputs.products || 'N0B,N0S,EET' }} apply=${{ inputs.apply || false }} z${{ inputs.min_zoom || '7' }}-${{ inputs.max_zoom || '10' }}

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - dev
      site:
        description: "Legacy single 3-letter Level III site id"
        required: true
        default: "IWA"
      sites:
        description: "Comma-separated Level III site ids"
        required: true
        default: "IWA,MPX,DLH"
      products:
        description: "Comma-separated Level III products"
        required: true
        default: "N0B,N0S,EET"
      apply:
        description: "Write tiles to R2"
        required: true
        default: false
        type: boolean
      min_zoom:
        description: "Minimum tile zoom"
        required: true
        default: "7"
        type: choice
        options:
          - "6"
          - "7"
          - "8"
      max_zoom:
        description: "Maximum tile zoom"
        required: true
        default: "10"
        type: choice
        options:
          - "8"
          - "9"
          - "10"
      retain_frames:
        description: "Rolling retained frames per product"
        required: true
        default: "12"
        type: choice
        options:
          - "3"
          - "6"
          - "12"
      max_frame_age_minutes:
        description: "Reject retained frames older than this"
        required: true
        default: "120"
        type: choice
        options:
          - "60"
          - "120"
          - "360"
      supersample:
        description: "Tile supersampling factor"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: level3-cycle-${{ inputs.target_env || 'production' }}-${{ inputs.sites || inputs.site || 'IWA,MPX,DLH' }}
  cancel-in-progress: true

jobs:
  level3-cycle:
    name: Publish bounded Level III radar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || vars.LEVEL3_SCHEDULE_ENABLED == 'true'

    defaults:
      run:
        working-directory: omniwx-api

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      LEVEL3_TARGET_ENV: ${{ inputs.target_env || 'production' }}
      LEVEL3_SITES: ${{ github.event_name == 'schedule' && (vars.LEVEL3_SCHEDULE_SITES || 'IWA') || inputs.sites || inputs.site || 'IWA,MPX,DLH' }}
      LEVEL3_PRODUCTS: ${{ inputs.products || 'N0B,N0S,EET' }}
      LEVEL3_MIN_ZOOM: ${{ inputs.min_zoom || '7' }}
      LEVEL3_MAX_ZOOM: ${{ inputs.max_zoom || '10' }}
      LEVEL3_RETAIN_FRAMES: ${{ inputs.retain_frames || '12' }}
      LEVEL3_MAX_FRAME_AGE_MINUTES: ${{ inputs.max_frame_age_minutes || '120' }}
      LEVEL3_SUPERSAMPLE: ${{ inputs.supersample || '1' }}
      LEVEL3_APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
      LEVEL3_SMOKE_BASE_URL: ${{ (inputs.target_env || 'production') == 'dev' && 'https://omniwx-api.omniwx.workers.dev' || 'https://omniwx-api-production.omniwx.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: omniwx-api/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Install Level III Python dependencies
        run: python -m pip install --target ../tmp/level3-pydeps metpy numpy pillow

      - name: Check R2 credentials
        if: env.LEVEL3_APPLY == 'true'
        shell: bash
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured as a GitHub Actions secret"
              missing=1
            fi
          done
          exit "$missing"

      - name: Type-check API scripts
        run: npx tsc --noEmit

      - name: Run Level III products
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra sites <<< "$LEVEL3_SITES"
          IFS=',' read -ra products <<< "$LEVEL3_PRODUCTS"
          for raw_site in "${sites[@]}"; do
            site="$(echo "$raw_site" | tr '[:lower:]' '[:upper:]' | sed -E 's/^K([A-Z0-9]{3})$/\1/' | xargs)"
            if [ -z "$site" ]; then
              continue
            fi
            for raw_product in "${products[@]}"; do
              product="$(echo "$raw_product" | tr '[:lower:]' '[:upper:]' | xargs)"
              if [ -z "$product" ]; then
                continue
              fi
              echo "::group::Level III $site $product"
              args=(
                --env "$LEVEL3_TARGET_ENV"
                --site "$site"
                --product "$product"
                --min-z "$LEVEL3_MIN_ZOOM"
                --max-z "$LEVEL3_MAX_ZOOM"
                --max-tiles 2000
                --min-tiles 1
                --retain-frames "$LEVEL3_RETAIN_FRAMES"
                --max-frame-age-minutes "$LEVEL3_MAX_FRAME_AGE_MINUTES"
                --supersample "$LEVEL3_SUPERSAMPLE"
              )
              if [ "$LEVEL3_APPLY" = "true" ]; then
                args+=(--apply)
              else
                echo "::warning::This product is a dry-run. It will render Level III tiles but will not write to R2."
              fi
              npm run level3:cycle -- "${args[@]}"
              echo "::endgroup::"
            done
          done

      - name: Smoke test Level III timelines
        if: env.LEVEL3_APPLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra sites <<< "$LEVEL3_SITES"
          IFS=',' read -ra products <<< "$LEVEL3_PRODUCTS"
          for raw_site in "${sites[@]}"; do
            site="$(echo "$raw_site" | tr '[:lower:]' '[:upper:]' | sed -E 's/^K([A-Z0-9]{3})$/\1/' | xargs)"
            if [ -z "$site" ]; then
              continue
            fi
            for raw_product in "${products[@]}"; do
              product="$(echo "$raw_product" | tr '[:lower:]' '[:upper:]' | xargs)"
              if [ -z "$product" ]; then
                continue
              fi
              url="$LEVEL3_SMOKE_BASE_URL/v1/radar/level3/timeline?site=$site&product=$product"
              out="/tmp/level3-$site-$product-timeline.json"
              curl --fail --silent --show-error "$url" > "$out"
              cat "$out"
              SITE="$site" PRODUCT="$product" node - <<'NODE'
          const fs = require("node:fs");
          const site = process.env.SITE;
          const product = process.env.PRODUCT;
          const timeline = JSON.parse(fs.readFileSync(`/tmp/level3-${site}-${product}-timeline.json`, "utf8"));
          if (!timeline.ok) throw new Error(`Level III ${site} ${product} timeline did not report ok`);
          const frame = Array.isArray(timeline.frames) ? timeline.frames[0] : null;
          if (!frame) throw new Error(`Level III ${site} ${product} timeline has no frames`);
          const validTimeMs = Date.parse(String(frame.validTime || frame.productTime || ""));
          if (!Number.isFinite(validTimeMs)) {
            throw new Error(`Level III ${site} ${product} newest frame has no parseable validTime`);
          }
          const ageMinutes = (Date.now() - validTimeMs) / 60_000;
          const maxAgeMinutes = Number(process.env.LEVEL3_MAX_FRAME_AGE_MINUTES || 120);
          if (ageMinutes > maxAgeMinutes) {
            throw new Error(`Level III ${site} ${product} newest frame is ${Math.round(ageMinutes)} minutes old, expected <= ${maxAgeMinutes}`);
          }
          if (frame.tileDelivery !== "worker-r2") {
            throw new Error(`Level III ${site} ${product} tileDelivery is ${frame.tileDelivery}, expected worker-r2`);
          }
          if (Number(frame.maxZoom || timeline.maxZoom || 0) < Number(process.env.LEVEL3_MAX_ZOOM || 0)) {
            throw new Error(`Level III ${site} ${product} maxZoom is ${frame.maxZoom || timeline.maxZoom}, expected ${process.env.LEVEL3_MAX_ZOOM}`);
          }
          NODE
            done
          done
